<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaashonSecureIoT – APA 6th Guide</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      cursor: none;
      font-family: 'Times New Roman', serif; 
      background: #fff; 
      color: #000;
      overflow-x: hidden;
    }
    #custom-cursor {
      position: fixed;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
    }
    #custom-cursor.clicking {
      transform: translate(-50%, -50%) scale(0.9);
    }
    .cover { 
      display: flex; 
      min-height: 100vh; 
      position: relative; 
    }
    .red-bar { 
      position: absolute; 
      left: 0; 
      top: 0; 
      bottom: 0; 
      width: 120px; 
      background: linear-gradient(180deg, #b30000 0%, #8b0000 100%);
      box-shadow: 4px 0 12px rgba(179, 0, 0, 0.3);
    }
    .content { 
      margin-left: 140px; 
      padding: 3rem; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      flex: 1; 
    }
    .title { 
      text-align: center; 
      color: #b30000; 
      font-size: 2.2rem; 
      font-weight: 700; 
      margin-top: 6rem; 
      line-height: 1.2;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .title span { 
      display: block; 
      font-size: 1.8rem; 
      margin-top: 0.5rem; 
    }
    .footer { 
      text-align: center; 
      font-size: 0.9rem; 
      color: #555; 
      line-height: 1.6; 
      margin-bottom: 1rem; 
    }
    .security-badge {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(179, 0, 0, 0.1);
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #b30000;
      font-size: 0.85rem;
      color: #b30000;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .security-badge::before {
      content: '🔒';
      font-size: 1rem;
    }
    @media (max-width: 768px) {
      .red-bar { width: 80px; }
      .content { margin-left: 100px; padding: 2rem; }
      .title { font-size: 1.8rem; margin-top: 4rem; }
      .title span { font-size: 1.5rem; }
      .security-badge {
        top: 10px;
        right: 10px;
        padding: 8px 15px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div id="custom-cursor">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
      <!-- Shield outline -->
      <path d="M16 2 L6 6 L6 14 Q6 22 16 30 Q26 22 26 14 L26 6 Z" 
            fill="#b30000" 
            stroke="#fff" 
            stroke-width="1.5"/>
      <!-- Lock symbol -->
      <rect x="12" y="14" width="8" height="6" fill="#fff" rx="1"/>
      <path d="M13 14 L13 11 Q13 9 16 9 Q19 9 19 11 L19 14" 
            stroke="#fff" 
            stroke-width="2" 
            fill="none"/>
      <!-- Shine effect -->
      <path d="M10 8 Q12 10 14 8" 
            stroke="#fff" 
            stroke-width="1.5" 
            fill="none" 
            opacity="0.6"/>
    </svg>
  </div>

  <div class="security-badge">NaashonSecureIoT</div>

  <div class="cover">
    <div class="red-bar"></div>
    <div class="content">
      <h1 class="title">
        A beginner's guide to the<br>
        <span>APA 6<sup>th</sup> ed.<br>referencing style</span>
      </h1>
      <div class="footer">
        The guide has been prepared by staff from the UCOL Student Experience Team (SET)<br>
        Library and Learning Services<br>
        December 2011
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const cursor = document.getElementById('custom-cursor');
      const colors = ['#b30000', '#dc143c', '#ff4500', '#0066cc', '#00aa00', '#9900cc'];
      let colorIndex = 0;

      document.addEventListener('mousemove', function(e) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });

      document.addEventListener('mousedown', function() {
        cursor.classList.add('clicking');
      });

      document.addEventListener('mouseup', function() {
        cursor.classList.remove('clicking');
      });

      document.addEventListener('click', function() {
        colorIndex = (colorIndex + 1) % colors.length;
        const newColor = colors[colorIndex];
        const shield = cursor.querySelector('path');
        shield.style.fill = newColor;
        cursor.style.filter = `drop-shadow(0 0 8px ${newColor})`;
      });
    });
  </script>
</body>
</html>
