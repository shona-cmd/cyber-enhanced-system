<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTAC NaashonSecureIoT - Secure Login</title>
  <style>
    body {
      cursor: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transition: none;
    }
    #custom-cursor img {
      width: 32px;
      height: 32px;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 3rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #2c3e50;
      font-weight: 300;
    }
    .brand {
      font-size: 1.5rem;
      color: #3498db;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    form {
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #555;
      font-weight: 500;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 1rem;
    }
    button:hover {
      background: #2980b9;
    }
    .register-link {
      margin-top: 1.5rem;
      text-align: center;
    }
    .register-link a {
      color: #3498db;
      text-decoration: none;
      font-weight: 500;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .error {
      color: #e74c3c;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const cursor = document.createElement('div');
      cursor.id = 'custom-cursor';
      cursor.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor" width="32" height="32"><path d="M32 2C20 2 10 12 10 24V40C10 48 16 54 24 56V62H40V56C48 54 54 48 54 40V24C54 12 44 2 32 2Z"/><path d="M22 32L28 38L42 24" stroke="black" stroke-width="3" fill="none"/><circle cx="32" cy="32" r="8" fill="black"/></svg>';
      document.body.appendChild(cursor);

      document.addEventListener('mousemove', function(e) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });

      document.addEventListener('click', function() {
        const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        cursor.style.color = randomColor;
        cursor.style.filter = `drop-shadow(0 0 10px ${randomColor})`;
      });
    });
  </script>
</head>
<body>
  <div class="login-container">
    <h2>Secure Login</h2>
    <div class="brand">MTAC NaashonSecureIoT</div>
    <form method="post" action="/login">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Login</button>
    </form>
    <div class="register-link">
      Don't have an account? <a href="/register">Register</a>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
