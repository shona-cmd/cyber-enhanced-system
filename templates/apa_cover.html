<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APA 6th – Secure Login</title>
  <style>
    body {
      cursor: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transition: none;
    }
    #custom-cursor img {
      width: 32px;
      height: 32px;
    }
    .cover-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 3rem;
      text-align: center;
      max-width: 600px;
      width: 90%;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #2c3e50;
      font-weight: 300;
    }
    h1 span {
      color: #3498db;
      font-weight: 500;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #7f8c8d;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .logo-placeholder {
      font-size: 3rem;
      color: #3498db;
      margin: 1rem 0;
      font-weight: bold;
    }
    .nav-links {
      margin-top: 2rem;
    }
    .nav-links a {
      display: inline-block;
      margin: 0 1rem;
      padding: 0.75rem 1.5rem;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      transition: background 0.3s ease;
      font-weight: 500;
    }
    .nav-links a:hover {
      background: #2980b9;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const cursor = document.createElement('div');
      cursor.id = 'custom-cursor';
      cursor.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor" width="32" height="32"><path d="M32 2C20 2 10 12 10 24V40C10 48 16 54 24 56V62H40V56C48 54 54 48 54 40V24C54 12 44 2 32 2Z"/><path d="M22 32L28 38L42 24" stroke="black" stroke-width="3" fill="none"/><circle cx="32" cy="32" r="8" fill="black"/></svg>';
      document.body.appendChild(cursor);

      document.addEventListener('mousemove', function(e) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });

      document.addEventListener('click', function() {
        const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        cursor.style.color = randomColor;
        cursor.style.filter = `drop-shadow(0 0 10px ${randomColor})`;
      });
    });
  </script>
</head>
<body>
  <div class="cover-container">
    <h1>
      A beginner's guide to the<br>
      <span>APA 6<sup>th</sup> ed.<br>referencing style</span>
    </h1>
    <div class="logo-placeholder">📚</div>
    <div class="subtitle">
      The guide has been prepared by staff from the UCOL Student Experience Team (SET)<br>
      Library and Learning Services<br>
      December 2011
    </div>
    <div class="nav-links">
      <a href="/login">Login</a>
      <a href="/register">Register</a>
    </div>
  </div>
</body>
</html>
