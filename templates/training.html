<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MTAC | Cyber Cursor Training</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0e17;
      color: #00ffcc;
      cursor: none !important;
      overflow: hidden;
      height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #001f3f, #003366);
      padding: 1.5rem;
      text-align: center;
      border-bottom: 3px solid #00ffcc;
      box-shadow: 0 4px 20px rgba(0, 255, 204, 0.3);
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #00ffcc;
    }
    .tagline {
      font-size: 1.1rem;
      color: #a0f7ff;
      font-style: italic;
    }

    .container {
      max-width: 1000px;
      margin: 3rem auto;
      padding: 2rem;
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid #00ffcc;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
      text-align: center;
    }

    @media (max-width: 768px) {
      .container {
        margin: 1rem;
        padding: 1rem;
      }
      h1 {
        font-size: 2rem;
      }
      h2 {
        font-size: 1.5rem;
      }
    }

    .alert-box {
      background: rgba(255, 50, 50, 0.15);
      border: 1px solid #ff3366;
      color: #ff99aa;
      padding: 1rem;
      border-radius: 8px;
      margin: 2rem 0;
      font-weight: bold;
    }



    .instructions {
      margin-top: 2rem;
      font-size: 1.1rem;
      line-height: 1.8;
      color: #a0f7ff;
    }
    .highlight { color: #00ffcc; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>MTAC CYBER TRAINING</h1>
    <p class="tagline">Precision. Control. Security.</p>
  </header>



  <div class="container">
    <h2>Cursor Control Module</h2>
    <div class="alert-box">
      TRAINING: <span class="highlight">ACTIVE</span> | Master precision control
    </div>
    <p>Enhance your <span class="highlight">cybersecurity skills</span> with interactive training.</p>
    <p><strong>Focus on accuracy</strong> → Build secure habits.</p>

    <div class="instructions">
      <p><strong>Training Goal:</strong> Master precision under pressure.</p>
      <p><strong>Status:</strong> <span class="highlight">FULLY OPERATIONAL</span></p>
    </div>
  </div>

</body>
</html>
